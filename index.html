<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a"><meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon.svg"><link rel="apple-touch-icon" href="./icon.svg">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<script>window.MI_API='https://www.mortattoo.com/_functions/miApi';</script>
</head><body>
<title>Mor Ink Availability</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: the original Piercing Switch look — centred brand, artist pills, one big gold switch for the chosen day;
   bookings, the week board and the artist's agenda stack under it (side column on a laptop). Dark only, by design. */
:root{
  --gold:#d4af37; --gold-hi:#f3d77a; --gold-lo:#8c6b1f; --gold-ink:#120e03; --gold-wash:rgba(212,175,55,.10);
  --ink:#0a0a0a; --panel:#141414; --panel2:#1b1b1b; --line:#2a2410; --line2:#3b331a;
  --text:#ede6d3; --soft:#cfc6ae; --muted:#8e8570; --faint:#5e5747;
  --ok:#8fc9a3; --ok-wash:rgba(143,201,163,.10); --warn:#e8a23a; --warn-wash:rgba(232,162,58,.12); --bad:#ec7b69; --bad-wash:rgba(236,123,105,.12);
  --tattoo:#5b5446;
  --display:"Cinzel",Georgia,serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--ink)}
body{margin:0;min-height:100%;color:var(--text);font:15px/1.45 var(--body);background:radial-gradient(120% 60% at 50% 0%,#1a160b 0%,var(--ink) 55%) var(--ink);background-attachment:fixed;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.wrap{max-width:440px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:26px 40px;display:flex;flex-direction:column;gap:26px}
.col{display:flex;flex-direction:column;gap:22px;min-width:0}
.stage{display:flex;flex-direction:column;align-items:center;gap:18px}

/* brand */
header.brandbar{position:relative;text-align:center}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.32em;font-size:15px;color:var(--gold);padding-left:.32em}
.rule{width:64px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:11px auto}
.sub{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.menu{position:absolute;right:0;top:-6px;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer}
.menu svg{width:20px;height:20px;stroke:var(--gold)}

/* artist pills */
.who{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;width:100%}
.who button{flex:1;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;min-height:40px;border-radius:999px;cursor:pointer;position:relative;padding:0 6px}
.who button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
.who button .pip{position:absolute;top:6px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.who button[aria-pressed="true"] .pip{background:var(--gold-ink)}

/* date bar */
.datebar{width:100%;display:flex;align-items:center;gap:10px}
.arrow{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--gold);font-size:22px;cursor:pointer;flex:none}
.arrow:disabled{opacity:.3;cursor:default}
.datebox{flex:1;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.datebox .rel{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.datebox .full{font-size:14px;color:var(--soft);font-weight:500}
.datebox input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

/* the switch */
.switch{position:relative;width:220px;height:220px;border-radius:50%;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-family:var(--display);transition:transform .15s ease,box-shadow .3s ease;margin-top:6px}
.switch:active{transform:scale(.97)}
.switch::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px solid var(--line)}
.switch .state{font-size:38px;font-weight:700;letter-spacing:.12em;padding-left:.12em}
.switch .what{font-family:var(--body);font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.85;text-align:center;max-width:160px}
.switch.off{background:radial-gradient(circle at 35% 30%,#262626,#121212 60%,#070707);color:var(--gold);box-shadow:0 0 0 2px var(--gold-lo) inset,0 10px 30px rgba(0,0,0,.6)}
.switch.on{background:radial-gradient(circle at 35% 30%,var(--gold-hi),var(--gold) 45%,var(--gold-lo));color:var(--gold-ink);box-shadow:0 0 0 2px #000 inset,0 0 44px rgba(212,175,55,.4),0 10px 30px rgba(0,0,0,.6)}
.switch.pending{background:radial-gradient(circle at 35% 30%,#2a2416,#141209 60%,#070707);color:var(--gold-hi);box-shadow:0 0 0 2px var(--gold) inset,0 10px 30px rgba(0,0,0,.6)}
.switch.pending::before{border-color:var(--gold-lo);animation:ring 1.6s infinite}
.switch.alert{background:radial-gradient(circle at 35% 30%,#2b1a14,#140c09 60%,#070707);color:var(--bad);box-shadow:0 0 0 2px var(--bad) inset,0 10px 30px rgba(0,0,0,.6)}
.switch.booked{background:radial-gradient(circle at 35% 30%,#1f1d18,#11100d 60%,#070707);color:var(--muted);box-shadow:0 0 0 2px var(--tattoo) inset}
@keyframes ring{50%{opacity:.25}}
.tap{font-size:12px;color:var(--muted);letter-spacing:.06em;text-align:center;margin-top:-4px}
.pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--soft);cursor:pointer}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.pill.ok i{background:var(--ok)} .pill.gold i{background:var(--gold)} .pill.bad i{background:var(--bad)}
.pill.work{border-color:#5a4114;color:#f3c77a} .pill.work i{background:var(--warn);animation:ring 1.4s infinite}
.pill.bad{border-color:#5d2a24;color:#f6c1b8}

/* panels */
.panel{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.panel h2{font-family:var(--display);font-size:13px;letter-spacing:.2em;color:var(--gold);margin:0 0 12px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.panel h2 small{font-family:var(--body);font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;font-weight:600}
.totals{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tot{font-size:12px;padding:4px 9px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--soft);font-variant-numeric:tabular-nums}
.tot b{color:var(--text)}
.bk{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.bk:first-of-type{border-top:0}
.bk .t{font-variant-numeric:tabular-nums;font-size:13px;color:var(--soft);line-height:1.3}
.bk .c{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.bk .s{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.bk .go{font-size:12px;color:var(--gold);white-space:nowrap}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:5px;margin-right:6px;vertical-align:1px}
.tag.tattoo{background:#2a2720;color:#cbbf9f}.tag.piercing{background:var(--gold-wash);color:var(--gold-hi)}.tag.consult{background:var(--ok-wash);color:var(--ok)}.tag.touchup{background:#222;color:var(--soft)}.tag.win{background:var(--gold);color:var(--gold-ink)}
.empty{font-size:13px;color:var(--faint)}
.attn{display:flex;flex-direction:column;gap:8px}
.attn button{display:flex;gap:10px;align-items:center;text-align:left;width:100%;padding:12px 14px;border-radius:12px;border:1px solid #5d2a24;background:var(--bad-wash);cursor:pointer;min-height:48px;color:#f6c1b8}
.attn button.soft{border-color:#5a4114;background:var(--warn-wash);color:#f3d9a4}
.attn svg{width:18px;height:18px;flex:none}

/* week board */
.board{display:grid;grid-template-columns:56px repeat(3,minmax(0,1fr));gap:6px}
.bh{text-align:center;font-size:10px;color:var(--muted);line-height:1.2;letter-spacing:.06em;text-transform:uppercase;padding-bottom:4px}
.bh b{display:block;font-size:15px;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:0}
.bh.today b{color:var(--gold)}
.bl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);display:flex;align-items:center}
.cell{min-height:70px;border-radius:9px;border:1px solid var(--line);background:var(--ink);display:flex;flex-direction:column;gap:3px;padding:4px 3px;cursor:pointer;position:relative;text-align:center}
.cell[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.bar{height:6px;border-radius:3px}
.bar.t{background:repeating-linear-gradient(135deg,var(--tattoo) 0 3px,#3e3a31 3px 6px)}
.bar.o{background:var(--gold)} .bar.w{background:var(--warn)}
.cell .tx{font-size:12px;line-height:1.15;color:var(--gold-hi);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.cell .tx.m{color:var(--faint)} .cell .tx.n{color:var(--soft)}
.cell .gd{position:absolute;right:4px;bottom:4px;width:6px;height:6px;border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:11px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend .bar{width:16px;display:inline-block}
.agenda-day{padding:12px 0;border-top:1px solid var(--line)}
.agenda-day:first-of-type{border-top:0;padding-top:0}
.agenda-day h3{margin:0 0 6px;font-size:14px;font-weight:600;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.agenda-day h3 span{font-size:12px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}

footer{font-size:11px;color:var(--faint);letter-spacing:.12em;text-transform:uppercase;text-align:center;line-height:1.8}

/* buttons, forms */
.btn{min-height:50px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);font-weight:600;font-size:15px;cursor:pointer;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--text);transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:transparent}
.btn.outline{background:transparent;border-color:var(--gold);color:var(--gold)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:#5d2a24;background:transparent}
.btn.danger.armed{background:var(--bad);color:#1a0806;border-color:transparent}
.btn.sm{min-height:38px;font-size:13px;padding:0 12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.full{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>.btn{flex:1 1 130px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted);letter-spacing:.06em}
.field input,.field select{min-height:46px;border-radius:10px;border:1px solid var(--line2);background:var(--ink);padding:0 12px;width:100%}
.field small{font-size:12px;color:var(--faint)}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92%;overflow:auto;background:var(--panel);border-top:1px solid var(--line2);border-radius:22px 22px 0 0;transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.sheet.on{transform:none}
.sheet-in{max-width:560px;margin:0 auto;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet-h h3{margin:0;font-family:var(--display);font-size:16px;letter-spacing:.14em;color:var(--gold);font-weight:700;text-wrap:balance}
.x{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;cursor:pointer;flex:none}
.x svg{width:18px;height:18px}
.label{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.pick{flex:none;min-width:56px;min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 10px;font-variant-numeric:tabular-nums}
.pick small{font-size:11px;color:var(--muted)} .pick b{font-size:15px}
.pick[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-wash)}
.pick[aria-pressed="true"] small{color:var(--gold-hi)}
.pick.busy{background:repeating-linear-gradient(135deg,#1a1917 0 5px,#141312 5px 10px);color:var(--muted)}
.pick:disabled{opacity:.3;cursor:default}
.hours{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.hours .pick{min-width:0;min-height:44px}
.ribbon{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;height:30px;border-radius:9px;overflow:hidden;background:var(--line)}
.ribbon div{background:var(--ink)}
.ribbon div.busy{background:repeating-linear-gradient(135deg,var(--tattoo) 0 4px,#3e3a31 4px 8px)}
.ribbon div.sel{background:var(--gold)}
.ribbon div.sel.busy{background:repeating-linear-gradient(135deg,var(--bad) 0 4px,#7a3a31 4px 8px)}
.ribbon-l{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px;padding:6px 14px;border-radius:12px;border:1px solid var(--line);background:var(--ink);cursor:pointer;width:100%;text-align:left}
.toggle small{display:block;color:var(--muted);font-size:12px}
.sw{width:46px;height:28px;border-radius:14px;background:var(--line2);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--soft);transition:transform .2s}
.toggle[aria-checked="true"] .sw{background:var(--gold)}
.toggle[aria-checked="true"] .sw::after{transform:translateX(18px);background:var(--gold-ink)}
.stack{display:flex;flex-direction:column;gap:8px}
.check{border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.45;display:flex;gap:10px;align-items:flex-start}
.check svg{width:18px;height:18px;flex:none;margin-top:1px}
.check.ok{background:var(--ok-wash);color:#d3eedc}.check.warn{background:var(--warn-wash);color:#f3d9a4}.check.bad{background:var(--bad-wash);color:#f6c1b8}
.check .sugg{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.check .sugg button{border:1px solid currentColor;background:transparent;border-radius:8px;padding:6px 10px;cursor:pointer;color:inherit;font-weight:600}
.summary{border-radius:14px;border:1px solid var(--gold-lo);background:var(--gold-wash);padding:14px;display:flex;flex-direction:column;gap:4px}
.summary .big{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.06em;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.summary .sm{color:var(--soft);font-size:13px}
.post{white-space:pre-wrap;font-size:14px;line-height:1.55;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--text);user-select:all;-webkit-user-select:all}
details summary{cursor:pointer;color:var(--soft);font-size:14px;min-height:36px;display:flex;align-items:center}
.steps{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;padding-bottom:18px;position:relative}
.step::before{content:"";position:absolute;left:14px;top:30px;bottom:2px;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2);background:var(--ink)}
.dot svg{width:16px;height:16px}
.dot.ok{background:var(--ok-wash);border-color:#2f5a44;color:var(--ok)}
.dot.work{background:var(--warn-wash);border-color:#5a4318;color:var(--warn)}
.dot.bad{background:var(--bad-wash);border-color:#5d2a24;color:var(--bad)}
.dot.idle{color:var(--muted)}
.dot.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.step h4{margin:4px 0;font-size:15px;font-weight:600}
.step p{margin:0;color:var(--soft);font-size:14px}
.step ol{margin:8px 0 0;padding-left:20px;color:var(--soft);font-size:14px;line-height:1.65}
.step ol b{color:var(--text)}
.step .row{margin-top:10px}
.hist{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.conn{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.conn:first-of-type{border-top:0}
.conn b{font-size:14px;display:flex;gap:8px;align-items:center}
.conn b i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.conn b i.ok{background:var(--ok)} .conn b i.bad{background:var(--bad)} .conn b i.work{background:var(--warn)}
.conn small{display:block;color:var(--muted);font-size:12px;margin-top:2px;overflow-wrap:anywhere}
.artist-set{border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--ink)}
.artist-set summary{font-weight:600;min-height:50px}
.artist-set .stack{padding-bottom:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--panel2);border:1px solid var(--line2);padding:12px 16px;border-radius:12px;z-index:60;opacity:0;transition:.2s;max-width:calc(100% - 32px);font-size:14px}
.toast.on{opacity:1;transform:translate(-50%,0)}
.login{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:18px;text-align:center}
.login input{min-height:56px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);font:600 22px var(--body);text-align:center;letter-spacing:.3em;width:100%}
.banner{border-radius:12px;padding:10px 14px;font-size:13px;line-height:1.45;border:1px solid var(--line);background:var(--panel);color:var(--soft);width:100%}
.banner b{color:var(--text)} .banner.warn{border-color:#5a4318;background:var(--warn-wash);color:#f3d9a4}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.skel{height:220px;width:220px;border-radius:50%;margin:60px auto;background:radial-gradient(circle,#1a1a1a,#0d0d0d);animation:ring 1.4s infinite}

@media (min-width:960px){
  .wrap{max-width:1180px;display:grid;grid-template-columns:400px minmax(0,1fr);column-gap:40px;align-items:start;padding-top:34px}
  .wrap>header.brandbar,.wrap>.banners{grid-column:1/-1}
  .wrap>footer{grid-column:1/-1}
  .cell{min-height:92px} .cell .tx{font-size:12px}
  .sheet{left:50%;right:auto;top:50%;bottom:auto;width:min(600px,calc(100% - 48px));max-height:88vh;border-radius:20px;border:1px solid var(--line2);transform:translate(-50%,-47%);opacity:0;pointer-events:none;transition:transform .22s,opacity .22s}

<script>
// Mor Ink Availability Manager — core logic.
// Pure JavaScript: no Wix imports, so the same file runs in Wix Velo, in Node tests,
// and inside the app's preview mode. Everything outside (database, Google, calendar,
// push notifications, clock) is passed in through createService().

const TZ = 'America/Toronto';
const BUSINESS = { open: 10, close: 19 };
const MAX_DAYS_AHEAD = 60;
// The Wix job runs hourly, "within 5 minutes" of the hour (Wix docs). Used only in wording.
const CLOSE_LAG_TEXT = 'at the next hourly check, normally within 10 minutes';
function validBookingUrl(u) { return typeof u === 'string' && /^https:\/\/(www\.)?fresha\.com\/.+/i.test(u); }

const ARTISTS = {
  mor: { id: 'mor', name: 'Mor', freshaColumn: 'Piercing', blockName: 'Piercings closed', bufferMin: 30, usualStart: 10, offers: ['walkin', 'piercing', 'consult'], googleAuto: true, bookingUrl: '', calendarId: '', trackCalendar: true },
  alexia: { id: 'alexia', name: 'Alexia', freshaColumn: 'Alexia Piercing', blockName: 'Alexia piercings closed', bufferMin: 30, usualStart: 12, offers: ['walkin', 'piercing'], googleAuto: true, bookingUrl: '', calendarId: '', trackCalendar: true },
  tal: { id: 'tal', name: 'Tal', freshaColumn: 'Tal', blockName: 'Tal closed', bufferMin: 30, usualStart: 11, offers: ['walkin', 'piercing'], googleAuto: true, bookingUrl: '', calendarId: '', trackCalendar: true },
  jia: { id: 'jia', name: 'Jia', freshaColumn: 'Jia', blockName: 'Jia closed', bufferMin: 30, usualStart: 11, offers: ['walkin'], googleAuto: true, bookingUrl: '', calendarId: '', trackCalendar: false },
};

const SERVICE_NAMES = { walkin: 'Walk-in tattoos', piercing: 'Piercings', consult: 'Consultations' };
const ARTIST_DEFAULTS = JSON.parse(JSON.stringify(ARTISTS));

// Settings Mor can change in the app (Connections). Only these keys, cleaned.
function cleanArtistConfig(input) {
  const out = {};
  for (const a of Object.keys(ARTISTS)) {
    const c = (input && input[a]) || {};
    const o = {};
    if (typeof c.bookingUrl === 'string') o.bookingUrl = validBookingUrl(c.bookingUrl.trim()) ? c.bookingUrl.trim() : '';
    if (typeof c.freshaColumn === 'string' && c.freshaColumn.trim()) o.freshaColumn = c.freshaColumn.trim().slice(0, 40);
    if (typeof c.blockName === 'string' && c.blockName.trim()) o.blockName = c.blockName.trim().slice(0, 60);
    if (Number.isInteger(c.usualStart) && c.usualStart >= BUSINESS.open && c.usualStart < BUSINESS.close) o.usualStart = c.usualStart;
    if (typeof c.googleAuto === 'boolean') o.googleAuto = c.googleAuto;
    if (typeof c.trackCalendar === 'boolean') o.trackCalendar = c.trackCalendar;
    if (typeof c.calendarId === 'string') o.calendarId = /^[A-Za-z0-9._%+\-#]+@[A-Za-z0-9.\-]+$/.test(c.calendarId.trim()) ? c.calendarId.trim() : '';
    out[a] = o;
  }
  return out;
}
function applyArtistConfig(cfg) {
  for (const a of Object.keys(ARTISTS)) Object.assign(ARTISTS[a], ARTIST_DEFAULTS[a], (cfg && cfg[a]) || {});
}
function escHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function needsFresha(sv) { return !!(sv.piercing || sv.consult); }

// ---------- time helpers (America/Toronto, DST-safe) ----------
const pad = (n) => (n < 10 ? '0' : '') + n;

function partsIn(date, tz = TZ) {
  const f = new Intl.DateTimeFormat('en-CA', {
    timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit', weekday: 'short',
  });
  const o = {};
  for (const p of f.formatToParts(date)) o[p.type] = p.value;
  return {
    year: +o.year, month: +o.month, day: +o.day, hour: +o.hour % 24, minute: +o.minute,
    second: +o.second, weekday: o.weekday,
  };
}

function localParts(date) {
  const p = partsIn(date);
  return { ...p, dateKey: `${p.year}-${pad(p.month)}-${pad(p.day)}` };
}

function offsetMs(date) {
  const p = partsIn(date);
  const asUtc = Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second);
  return asUtc - Math.floor(date.getTime() / 1000) * 1000;
}

// Local Toronto wall-clock time -> real Date (UTC instant).
function localToUtc(dateKey, hour, minute = 0) {
  const [y, m, d] = dateKey.split('-').map(Number);
  const guess = Date.UTC(y, m - 1, d, hour, minute);
  let t = guess - offsetMs(new Date(guess));
  t = guess - offsetMs(new Date(t));
  return new Date(t);
}

function addDays(dateKey, n) {
  const [y, m, d] = dateKey.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d + n));
  return `${dt.getUTCFullYear()}-${pad(dt.getUTCMonth() + 1)}-${pad(dt.getUTCDate())}`;
}

function daysBetween(a, b) {
  const [y1, m1, d1] = a.split('-').map(Number);
  const [y2, m2, d2] = b.split('-').map(Number);
  return Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 86400000);
}

function hourLabel(h) {
  if (h === 0 || h === 24) return '12 AM';
  if (h === 12) return '12 PM';
  return h < 12 ? `${h} AM` : `${h - 12} PM`;
}
function rangeLabel(s, e) { return `${hourLabel(s)} – ${hourLabel(e)}`; }

const WD = { Sun: 'Sunday', Mon: 'Monday', Tue: 'Tuesday', Wed: 'Wednesday', Thu: 'Thursday', Fri: 'Friday', Sat: 'Saturday' };
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function dateLabel(dateKey, todayKey) {
  const [y, m, d] = dateKey.split('-').map(Number);
  const wd = new Date(Date.UTC(y, m - 1, d)).getUTCDay();
  const name = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][wd];
  const short = `${name}, ${MON[m - 1]} ${d}`;
  const diff = todayKey ? daysBetween(todayKey, dateKey) : null;
  if (diff === 0) return { rel: 'Today', short, long: `today (${short})`, weekday: WD[name] };
  if (diff === 1) return { rel: 'Tomorrow', short, long: `tomorrow (${short})`, weekday: WD[name] };
  return { rel: WD[name], short, long: `on ${WD[name]}, ${MON[m - 1]} ${d}`, weekday: WD[name] };
}

// ---------- calendar events ----------
// Fresha's own Google Calendar sync gives one event per appointment.
function classifyEvent(ev) {
  const s = (ev.summary || '').toLowerCase();
  if (/pierc/.test(s)) return 'piercing';
  if (/consult/.test(s)) return 'consult';
  if (/touch.?up/.test(s)) return 'touchup';
  return 'tattoo'; // "Fresha Appointment" and anything unknown is protected like a tattoo
}

function overlaps(aStart, aEnd, bStart, bEnd) { return aStart < bEnd && bStart < aEnd; }

// Hours within [start,end) that are free of every event (+ buffer for tattoos).
function freeHours(dateKey, start, end, events, bufferMin = 30) {
  const free = [];
  for (let h = start; h < end; h++) {
    const s = localToUtc(dateKey, h).getTime();
    const e = localToUtc(dateKey, h + 1).getTime();
    const busy = events.some((ev) => {
      const buf = classifyEvent(ev) === 'tattoo' ? bufferMin * 60000 : 0;
      return overlaps(s, e, new Date(ev.start).getTime() - buf, new Date(ev.end).getTime() + buf);
    });
    if (!busy) free.push(h);
  }
  return free;
}

function hoursToRanges(hours) {
  const out = [];
  for (const h of hours) {
    const last = out[out.length - 1];
    if (last && last[1] === h) last[1] = h + 1; else out.push([h, h + 1]);
  }
  return out;
}

// ---------- the safety check before opening ----------
function checkWindow(input, ctx) {
  const { artist, date, services } = input;
  let { start, end } = input;
  const { now, events, eventsVerified, windows } = ctx;
  const A = ARTISTS[artist];
  const today = localParts(now).dateKey;
  const errors = []; const warnings = []; const notes = [];

  if (!A) errors.push({ code: 'artist', text: 'Pick an artist.' });
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date || '')) errors.push({ code: 'date', text: 'Pick a date.' });
  if (!Number.isInteger(start) || !Number.isInteger(end)) errors.push({ code: 'time', text: 'Pick a start and end time.' });
  if (!services || !['walkin', 'piercing', 'consult'].some((k) => services[k])) errors.push({ code: 'services', text: 'Choose at least one thing clients can come in for.' });
  else if (A && ['walkin', 'piercing', 'consult'].some((k) => services[k] && !A.offers.includes(k))) errors.push({ code: 'services', text: `${A.name} doesn't offer that here.` });
  if (errors.length) return { ok: false, errors, warnings, notes, start, end };

  if (start < BUSINESS.open || end > BUSINESS.close || start >= end) {
    errors.push({ code: 'hours', text: `Windows must be inside shop hours, ${rangeLabel(BUSINESS.open, BUSINESS.close)}.` });
  }
  const ahead = daysBetween(today, date);
  if (ahead < 0) errors.push({ code: 'past', text: 'That date has already passed.' });
  if (ahead > MAX_DAYS_AHEAD) errors.push({ code: 'far', text: `Open up to ${MAX_DAYS_AHEAD} days ahead.` });

  if (ahead === 0) {
    const nowP = localParts(now);
    if (nowP.hour >= end) errors.push({ code: 'over', text: `It's already past ${hourLabel(end)} today.` });
    else if (nowP.hour >= start) {
      const ns = nowP.minute === 0 ? nowP.hour : nowP.hour + 1;
      if (ns >= end) errors.push({ code: 'over', text: `Less than an hour is left before ${hourLabel(end)}.` });
      else if (ns !== start) { notes.push(`${hourLabel(start)} has passed, so this opens from ${hourLabel(ns)}.`); start = ns; }
    }
  }

  const active = (windows || []).filter((w) => w.artist === artist && w.date === date && isActive(w));
  for (const w of active) {
    if (w.start === start && w.end === end) errors.push({ code: 'duplicate', text: `${A.name} is already open ${rangeLabel(start, end)} that day.`, windowId: w.id });
    else if (overlaps(start, end, w.start, w.end)) errors.push({ code: 'overlap', text: `This overlaps ${A.name}'s open window ${rangeLabel(w.start, w.end)}. Close that one first or pick other hours.`, windowId: w.id });
  }

  let conflicts = []; let free = [];
  if (!eventsVerified) {
    warnings.push({ code: 'unverified', text: `Couldn't read ${A ? A.name : ''}'s Fresha calendar, so tattoo bookings for this day are not confirmed. Check Fresha yourself before opening.` });
  } else if (!errors.length) {
    const s = localToUtc(date, start).getTime(); const e = localToUtc(date, end).getTime();
    conflicts = (events || []).filter((ev) => {
      const buf = classifyEvent(ev) === 'tattoo' ? A.bufferMin * 60000 : 0;
      return overlaps(s, e, new Date(ev.start).getTime() - buf, new Date(ev.end).getTime() + buf);
    });
    free = hoursToRanges(freeHours(date, start, end, events || [], A.bufferMin));
    if (conflicts.length) {
      const sugg = free.length ? ` Free in that range: ${free.map((r) => rangeLabel(r[0], r[1])).join(', ')}.` : '';
      errors.push({ code: 'conflict', text: `${A.name} has a booking in this window, so it stays protected.${sugg}`, conflicts: conflicts.map(slimEvent), free });
    }
  }
  return { ok: errors.length === 0, errors, warnings, notes, start, end, conflicts: conflicts.map(slimEvent), free };
}

// Fresha's calendar titles look like "Julie Rayner – Consultation With Mor", or just "Fresha Appointment"
// when Fresha's sync hides details. Some calendar descriptions include a client name, so use only
// the explicit first/last-name fields as a fallback. Never expose phone or email details.
function parseSummary(summary, description = '') {
  const s = String(summary || '').trim();
  const m = s.match(/^(.+?)\s+[–—-]\s+(.+)$/);
  if (m) return { client: m[1].trim(), service: m[2].trim() };
  if (/^fresha appointment$/i.test(s)) {
    const detail = String(description || '').replace(/<br\s*\/?>/gi, '\n').replace(/<\/(?:div|p|li)>/gi, '\n').replace(/<[^>]*>/g, ' ').replace(/&nbsp;/gi, ' ').replace(/&amp;/gi, '&');
    const field = (label) => detail.match(new RegExp(`(?:^|[\\n])\\s*${label}\\s*:\\s*(.*?)(?=\\s*(?:\\n|(?:First name|Last name|Phone|Email|Service)\\s*:|$))`, 'i'))?.[1]?.trim();
    const first = field('First name');
    const last = field('Last name');
    const name = [first, last].filter(Boolean).join(' ').trim();
    if (name) return { client: name, service: null };
  }
  return { client: null, service: s && !/^fresha appointment$/i.test(s) ? s : null };
}
function slimEvent(ev) { const p = parseSummary(ev.summary, ev.description); return { id: ev.id, summary: ev.summary, start: ev.start, end: ev.end, type: classifyEvent(ev), link: ev.link || null, client: p.client, service: p.service }; }

// ---------- Fresha steps (manual: Fresha has no public API) ----------
// The default in Fresha is a repeating all-day block ("Piercings closed") on the artist's
// piercing column. Opening a window = shrinking that block for one day so ONLY the window is
// bookable. Because the window is fenced by blocks, Fresha stops taking bookings at the end
// time on its own; nobody has to close Fresha in the evening.
function freshaOpenSteps(w) {
  if (!needsFresha(w.services)) return [];
  const A = { ...ARTISTS[w.artist], freshaColumn: escHtml(ARTISTS[w.artist].freshaColumn), blockName: escHtml(ARTISTS[w.artist].blockName) }; const d = dateLabel(w.date).short;
  const steps = [`Open the Fresha calendar on <b>${d}</b>, <b>${A.freshaColumn}</b> column.`];
  if (w.start === BUSINESS.open && w.end === BUSINESS.close) {
    steps.push(`Tap the grey <b>${A.blockName}</b> block → Delete → <b>This event only</b>.`);
  } else if (w.start === BUSINESS.open) {
    steps.push(`Tap the grey <b>${A.blockName}</b> block → Edit → <b>This event only</b>.`);
    steps.push(`Change its start time to <b>${hourLabel(w.end)}</b> (keep the end at 11:55 PM). Save.`);
  } else {
    steps.push(`Tap the grey <b>${A.blockName}</b> block → Edit → <b>This event only</b>.`);
    steps.push(`Change its end time to <b>${hourLabel(w.start)}</b>. Save.`);
    if (w.end < BUSINESS.close) steps.push(`Add → Blocked time: <b>${A.freshaColumn}</b>, ${d}, <b>${hourLabel(w.end)} – 11:55 PM</b>, doesn't repeat. Save.`);
  }
  if (!w.services.consult) steps.push('Consultations stay off: leave the consultation service turned off for online booking.');
  if (!w.services.piercing) steps.push('Piercings stay off: only the consultation service should be bookable online.');
  if (w.services.walkin) steps.push('Walk-in tattoos need nothing in Fresha. Add them as appointments when the client arrives.');
  return steps;
}

function freshaCloseSteps(w, fromHour) {
  if (!needsFresha(w.services)) return [];
  const A = { freshaColumn: escHtml(ARTISTS[w.artist].freshaColumn) }; const d = dateLabel(w.date).short;
  const from = Math.max(fromHour, w.start);
  return [
    `Add → Blocked time: <b>${A.freshaColumn}</b>, ${d}, <b>${hourLabel(from)} – ${hourLabel(w.end)}</b>, doesn't repeat. Save.`,
    'Existing appointments stay as they are. Fresha may warn that the block overlaps one; keep the appointment.',
  ];
}

// ---------- Google announcement ----------
function servicesLabel(sv) {
  const appt = sv.piercing && sv.consult ? 'piercing and consultation appointments' : sv.consult ? 'consultation appointments' : sv.piercing ? 'piercing appointments' : '';
  const t = sv.walkin ? (appt ? 'Walk-in tattoos and ' + appt : 'Walk-in tattoos') : appt.charAt(0).toUpperCase() + appt.slice(1);
  return t;
}
function servicesShort(sv) {
  return ['walkin', 'piercing', 'consult'].filter((k) => sv[k]).map((k) => ({ walkin: 'Walk-ins', piercing: 'Piercings', consult: 'Consults' }[k])).join(' & ');
}

function buildPost(w, opts) {
  const { todayKey, bookingUrl, remaining } = opts;
  const A = ARTISTS[w.artist];
  const d = dateLabel(w.date, todayKey);
  const when = d.rel === 'Today' ? 'today' : d.rel === 'Tomorrow' ? 'tomorrow' : `${d.weekday}, ${d.short.split(', ')[1]}`;
  const lines = [
    `${servicesLabel(w.services)} available ${when} with ${A.name} at Mor Ink Tattoo & Piercing in Oshawa.`,
    `Available from ${hourLabel(w.start)} until ${hourLabel(w.end)}.`,
  ];
  if (remaining && remaining.length && !(remaining.length === 1 && remaining[0][0] === w.start && remaining[0][1] === w.end)) {
    lines.push(`Still open: ${remaining.map((r) => rangeLabel(r[0], r[1])).join(' and ')}.`);
  }
  const book = needsFresha(w.services);
  if (w.services.walkin) lines.push(book ? 'Walk in for a tattoo, first come first served. Book online for piercings and consultations.' : 'Walk in during these hours, first come first served.');
  else lines.push(w.walkIns
    ? 'Walk-ins are welcome when the chair is free. Book online to hold your time.'
    : 'Appointments only. Book online to check availability.');
  const short = servicesShort(w.services);
  const [y, m, dd] = w.date.split('-').map(Number);
  return {
    languageCode: 'en-US',
    topicType: 'EVENT',
    summary: lines.join('\n'),
    event: {
      title: `${short} with ${A.name} · ${rangeLabel(w.start, w.end)}`.slice(0, 58),
      schedule: {
        startDate: { year: y, month: m, day: dd }, startTime: { hours: w.start, minutes: 0 },
        endDate: { year: y, month: m, day: dd }, endTime: { hours: w.end, minutes: 0 },
      },
    },
    callToAction: book ? { actionType: 'BOOK', url: bookingUrl } : { actionType: 'CALL' },
  };
}

function postMatches(post, body) {
  const a = post.event && post.event.schedule; const b = body.event.schedule;
  return !!a && post.event.title === body.event.title &&
    a.startDate && a.startDate.year === b.startDate.year && a.startDate.month === b.startDate.month &&
    a.startDate.day === b.startDate.day && (a.startTime || {}).hours === b.startTime.hours &&
    (a.endTime || {}).hours === b.endTime.hours;
}

// ---------- window state ----------
// status: awaiting_fresha → open → closing → closed | cancelled | attention
// fresha.state: waiting | applied (you confirmed) | close_needed | closed (you confirmed) | self_closed (blocks end it) | not_opened | not_needed (walk-ins only)
// google.state: waiting_fresha | off | manual | publishing | published | failed | removing | removed | remove_failed
function isActive(w) { return ['awaiting_fresha', 'open', 'closing', 'attention'].includes(w.status); }

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

function createService(deps) {
  const { store, google, calendar, notifier, clock, config } = deps;
  const now = () => (clock ? clock() : new Date());
  const today = () => localParts(now()).dateKey;
  const log = (level, msg, data) => store.appendLog({ at: now().toISOString(), level, msg, data: data || null });
  const bookingUrlFor = (a) => (ARTISTS[a] && ARTISTS[a].bookingUrl) || config.bookingUrl || '';
  async function loadCfg() { applyArtistConfig((await store.getMeta('artistConfig')) || {}); }

  async function idem(requestId, fn) {
    if (!requestId) throw httpErr(400, 'Missing request id.');
    const prev = await store.getRequest(requestId);
    if (prev) return prev.result;
    const result = await fn();
    await store.saveRequest(requestId, { at: now().toISOString(), result });
    return result;
  }

  async function events(artist, date) {
    if (ARTISTS[artist] && ARTISTS[artist].trackCalendar === false) return { verified: true, events: [], untracked: true };
    try {
      const r = await calendar.listEvents(artist, date, addDays(date, 1), ARTISTS[artist].calendarId);
      return { verified: true, events: r };
    } catch (e) {
      await log('warn', 'calendar read failed', { artist, date, error: String(e.message || e) });
      return { verified: false, events: [], error: String(e.message || e) };
    }
  }

  async function preview(input) {
    const ev = await events(input.artist, input.date);
    const windows = await store.listWindows({ from: input.date, to: addDays(input.date, 1) });
    const check = checkWindow(input, { now: now(), events: ev.events, eventsVerified: ev.verified, windows });
    const w = { ...input, start: check.start, end: check.end };
    return {
      check,
      fresha: check.ok ? freshaOpenSteps(w) : [],
      post: check.ok ? buildPost(w, { todayKey: today(), bookingUrl: bookingUrlFor(w.artist) }) : null,
      closesAt: check.ok ? localToUtc(w.date, w.end).toISOString() : null,
    };
  }

  async function openWindow(input) {
    return idem(input.requestId, async () => {
      const p = await preview(input);
      if (!p.check.ok) return { ok: false, check: p.check };
      if (p.check.warnings.some((x) => x.code === 'unverified') && !input.acknowledgeUnverified) {
        return { ok: false, needsAck: true, check: p.check };
      }
      const w = {
        id: 'w_' + uid(), artist: input.artist, date: input.date, start: p.check.start, end: p.check.end,
        services: { walkin: !!input.services.walkin, piercing: !!input.services.piercing, consult: !!input.services.consult }, walkIns: !!input.walkIns,
        closesAt: p.closesAt, createdAt: now().toISOString(), status: 'awaiting_fresha',
        protection: { verified: !p.check.warnings.length, checkedAt: now().toISOString(), notes: p.check.notes },
        fresha: { state: p.fresha.length ? 'waiting' : 'not_needed', steps: p.fresha },
        google: { state: 'waiting_fresha', postName: null, attempts: 0, error: null, publishedAt: null, verifiedAt: null, removedAt: null, text: p.post.summary },
        history: [{ at: now().toISOString(), text: 'Window selected; schedule checked' }],
      };
      if (w.fresha.state === 'not_needed') { w.status = 'open'; hist(w, 'Walk-ins only, so nothing to change in Fresha'); }
      await store.saveWindow(w);
      await log('info', 'window opened', { id: w.id, artist: w.artist, date: w.date, start: w.start, end: w.end });
      if (w.fresha.state === 'not_needed') await publish(w);
      return { ok: true, window: w };
    });
  }

  async function confirmFresha({ windowId, requestId }) {
    return idem(requestId, async () => {
      const w = await mustGet(windowId);
      if (w.fresha.state === 'waiting') {
        w.fresha = { ...w.fresha, state: 'applied', confirmedAt: now().toISOString() };
        w.status = now() >= new Date(w.closesAt) ? 'closing' : 'open';
        hist(w, 'You confirmed the window is open in Fresha');
        await store.saveWindow(w);
        await publish(w);
      } else if (w.fresha.state === 'close_needed') {
        w.fresha = { ...w.fresha, state: 'closed', closedConfirmedAt: now().toISOString() };
        hist(w, 'You confirmed the remaining time is blocked in Fresha');
        settle(w);
        await store.saveWindow(w);
      }
      return { ok: true, window: w };
    });
  }

  async function publish(w) {
    if (!['waiting_fresha', 'failed', 'off', 'manual'].includes(w.google.state)) return w;
    if (now() >= new Date(w.closesAt)) { w.google.state = 'off'; hist(w, 'Window already over; nothing posted'); await store.saveWindow(w); return w; }
    const g = await google.status();
    if (g.ready && ARTISTS[w.artist].googleAuto === false) { g.ready = false; g.reason = `Automatic Google posts are off for ${ARTISTS[w.artist].name}`; }
    if (g.ready && needsFresha(w.services) && !validBookingUrl(bookingUrlFor(w.artist))) { g.ready = false; g.reason = `Add ${ARTISTS[w.artist].name}'s Fresha booking link first`; }
    if (!g.ready) {
      w.google = { ...w.google, state: 'manual', error: g.reason };
      hist(w, 'Automatic Google posting not set up yet — copy the post by hand');
      await store.saveWindow(w); return w;
    }
    const body = buildPost(w, { todayKey: today(), bookingUrl: bookingUrlFor(w.artist) });
    w.google = { ...w.google, state: 'publishing', attempts: (w.google.attempts || 0) + 1, startedAt: now().toISOString(), error: null, text: body.summary };
    await store.saveWindow(w);
    try {
      // Never blindly duplicate: if an earlier attempt may have gone through, look first.
      let post = w.google.attempts > 1 ? (await google.listPosts()).find((p) => postMatches(p, body)) : null;
      if (!post) post = await google.createPost(body);
      if (post.state === 'REJECTED') throw Object.assign(new Error('Google rejected the post'), { code: 'REJECTED' });
      applyPostState(w, post);
    } catch (e) {
      if (e.code === 'TIMEOUT' || e.code === 'NETWORK' || (e.status && e.status >= 500)) {
        try {
          const found = (await google.listPosts()).find((p) => postMatches(p, body));
          if (found) {
            applyPostState(w, found);
            hist(w, 'Google was slow, but the request went through');
            await store.saveWindow(w); return w;
          }
        } catch (_) { /* fall through to failed */ }
      }
      w.google = { ...w.google, state: 'failed', error: friendly(e) };
      hist(w, 'Google post failed: ' + friendly(e));
      await log('error', 'google publish failed', { id: w.id, error: String(e.message || e), code: e.code || null });
    }
    await store.saveWindow(w);
    return w;
  }

  // Only Google saying LIVE counts as live. Anything else is "processing" until a later check sees LIVE.
  function applyPostState(w, post) {
    const live = post.state === 'LIVE';
    w.google = { ...w.google, state: live ? 'published' : 'processing', postName: post.name, liveState: post.state || null, verifiedAt: now().toISOString(), searchUrl: post.searchUrl || null };
    if (live) { w.google.publishedAt = w.google.publishedAt || now().toISOString(); hist(w, 'Google reports the update is live'); }
    else hist(w, 'Google accepted the update and is still processing it');
  }

  async function checkProcessing(w) {
    try {
      const p = (await google.listPosts()).find((x) => x.name === w.google.postName);
      if (!p) { w.google = { ...w.google, state: 'failed', error: 'Google no longer lists the post' }; hist(w, 'Google no longer lists the post'); }
      else if (p.state === 'REJECTED') { w.google = { ...w.google, state: 'failed', error: 'Google rejected the post' }; hist(w, 'Google rejected the post'); }
      else if (p.state === 'LIVE') applyPostState(w, p);
      else w.google.verifiedAt = now().toISOString();
    } catch (e) { await log('warn', 'processing check failed', { id: w.id, error: String(e.message || e) }); }
    await store.saveWindow(w);
  }

  async function removePost(w, reason) {
    if (w.google.state === 'manual') { w.google.state = 'manual_remove'; hist(w, 'Remember to delete the hand-made Google post'); return w; }
    if (!w.google.postName || !['published', 'processing', 'remove_failed', 'removing', 'failed'].includes(w.google.state)) {
      if (w.google.state === 'waiting_fresha' || w.google.state === 'failed') w.google.state = 'off';
      return w;
    }
    w.google.state = 'removing'; await store.saveWindow(w);
    try {
      await google.deletePost(w.google.postName);
      // Verify it is really gone.
      const still = (await google.listPosts()).some((p) => p.name === w.google.postName);
      if (still) throw Object.assign(new Error('Post still listed after delete'), { code: 'VERIFY' });
      w.google = { ...w.google, state: 'removed', removedAt: now().toISOString(), verifiedAt: now().toISOString(), error: null };
      hist(w, `Google update removed (${reason})`);
    } catch (e) {
      if (e.status === 404) {
        w.google = { ...w.google, state: 'removed', removedAt: now().toISOString(), error: null };
        hist(w, 'Google update was already gone');
      } else {
        w.google = { ...w.google, state: 'remove_failed', error: friendly(e), removeAttempts: (w.google.removeAttempts || 0) + 1 };
        hist(w, 'Removing the Google update failed: ' + friendly(e));
        await log('error', 'google remove failed', { id: w.id, error: String(e.message || e) });
        if (w.google.removeAttempts === 1) await safeNotify({ title: 'Needs attention', body: `Couldn't remove ${ARTISTS[w.artist].name}'s Google availability post. Open the app to retry.`, tags: 'warning' });
      }
    }
    return w;
  }

  function settle(w) {
    const freshaDone = ['self_closed', 'closed', 'not_opened', 'not_needed'].includes(w.fresha.state);
    const googleDone = ['removed', 'off', 'manual_done'].includes(w.google.state);
    if (freshaDone && googleDone) { if (w.status !== 'cancelled') w.status = 'closed'; }
    else if (w.google.state === 'remove_failed' || w.google.state === 'manual_remove') w.status = 'attention';
    else if (w.fresha.state === 'close_needed' || w.google.state === 'removing') w.status = 'closing';
  }

  async function closeWindow({ windowId, requestId }) {
    return idem(requestId, async () => {
      const w = await mustGet(windowId);
      if (!isActive(w)) return { ok: true, window: w };
      const n = now(); const p = localParts(n);
      const started = n >= localToUtc(w.date, w.start);
      if (w.fresha.state === 'waiting') w.fresha.state = 'not_opened';
      else if (w.fresha.state === 'applied') {
        if (n >= new Date(w.closesAt)) w.fresha.state = 'self_closed';
        else {
          const from = started && p.dateKey === w.date ? p.hour : w.start;
          w.fresha = { ...w.fresha, state: 'close_needed', closeSteps: freshaCloseSteps(w, from), closeFrom: from };
        }
      }
      w.closedEarlyAt = n.toISOString();
      hist(w, started ? 'You closed the rest of the window' : 'You cancelled this window');
      if (!started) w.cancelled = true;
      await removePost(w, 'closed early');
      settle(w);
      if (w.status === 'closed' && !started) w.status = 'cancelled';
      await store.saveWindow(w);
      return { ok: true, window: w };
    });
  }

  async function closeAllFuture({ artist, requestId }) {
    return idem(requestId, async () => {
      const ws = (await store.listWindows({ from: today(), to: addDays(today(), MAX_DAYS_AHEAD + 1) }))
        .filter((w) => isActive(w) && (!artist || w.artist === artist));
      const out = [];
      for (const w of ws) out.push((await closeWindow({ windowId: w.id, requestId: requestId + ':' + w.id })).window);
      return { ok: true, windows: out };
    });
  }

  async function retry({ windowId, requestId }) {
    return idem(requestId, async () => {
      const w = await mustGet(windowId);
      if (w.google.state === 'failed' && now() < new Date(w.closesAt) && w.fresha.state === 'applied') await publish(w);
      else if (w.google.state === 'processing' && isActive(w) && now() < new Date(w.closesAt) && !w.closedEarlyAt) await checkProcessing(w);
      else if (['remove_failed', 'published', 'processing', 'removing'].includes(w.google.state) && (!isActive(w) || w.status === 'attention' || now() >= new Date(w.closesAt) || w.closedEarlyAt)) await removePost(w, 'retry');
      settle(w); await store.saveWindow(w);
      return { ok: true, window: w };
    });
  }

  async function markManual({ windowId, requestId, what }) {
    return idem(requestId, async () => {
      const w = await mustGet(windowId);
      if (what === 'posted' && w.google.state === 'manual') { w.google.state = 'manual_posted'; hist(w, 'You posted on Google by hand'); }
      if (what === 'removed' && ['manual_remove', 'manual_posted', 'remove_failed'].includes(w.google.state)) { w.google.state = 'manual_done'; hist(w, 'You removed the Google post by hand'); settle(w); }
      await store.saveWindow(w);
      return { ok: true, window: w };
    });
  }

  // Runs every hour from the Wix scheduler AND every time the app loads.
  async function sweep() {
    const n = now();
    const ws = (await store.listWindows({ from: addDays(today(), -3), to: addDays(today(), MAX_DAYS_AHEAD + 1) })).filter(isActive);
    const report = { closed: 0, removed: 0, failed: 0, reconciled: 0, updated: 0 };
    for (const w of ws) {
      // A publish that never finished (app closed mid-way, timeout): reconcile with Google.
      if (w.google.state === 'publishing' && n - new Date(w.google.startedAt) > 5 * 60000) {
        w.google.state = 'failed'; w.google.error = 'Publishing did not finish';
        await publish(w); report.reconciled++;
      }
      if (w.google.state === 'processing' && n < new Date(w.closesAt)) await checkProcessing(w);
      if (n >= new Date(w.closesAt)) {
        if (w.fresha.state === 'applied') { w.fresha.state = 'self_closed'; hist(w, `Window ended at ${hourLabel(w.end)}. Your Fresha blocks should stop new bookings; the app can't check Fresha`); }
        if (w.fresha.state === 'waiting') { w.fresha.state = 'not_opened'; hist(w, 'Window ended before it was opened in Fresha'); }
        if (w.fresha.state === 'close_needed') { w.fresha.state = 'self_closed'; hist(w, 'Window ended before you confirmed the early-close block; your end-of-window block should cover it'); }
        if (['published', 'processing', 'remove_failed', 'removing'].includes(w.google.state)) {
          await removePost(w, `window ended at ${hourLabel(w.end)}`);
          if (w.google.state === 'removed') report.removed++; else report.failed++;
        } else if (w.google.state === 'manual_posted') { w.google.state = 'manual_remove'; hist(w, 'Window ended — delete the hand-made Google post'); }
        else if (['waiting_fresha', 'failed', 'publishing'].includes(w.google.state)) w.google.state = 'off';
        if (!w.endedAt) { w.endedAt = n.toISOString(); hist(w, 'Window ended'); }
        settle(w); report.closed++;
        await store.saveWindow(w);
        continue;
      }
      // Live window: keep the Google text honest if bookings filled hours.
      if (w.google.state === 'published' && w.status === 'open') {
        const ev = await events(w.artist, w.date);
        if (ev.verified) {
          const startH = Math.max(w.start, localParts(n).dateKey === w.date ? localParts(n).hour : w.start);
          const left = hoursToRanges(freeHours(w.date, startH, w.end, ev.events, ARTISTS[w.artist].bufferMin));
          const sig = JSON.stringify(left);
          if (sig !== w.google.remainingSig) {
            if (!left.length) {
              await removePost(w, 'fully booked'); w.fullyBooked = true;
              hist(w, 'Fully booked — Google update removed so nobody is promised a slot');
            } else if (w.google.remainingSig !== undefined || left.length !== 1 || left[0][0] !== w.start || left[0][1] !== w.end) {
              const text = buildPost(w, { todayKey: today(), bookingUrl: bookingUrlFor(w.artist), remaining: left }).summary;
              try { await google.patchSummary(w.google.postName, text); w.google.text = text; hist(w, 'Google text updated to the hours still open'); report.updated++; } catch (e) { await log('warn', 'patch failed', { id: w.id, error: String(e.message || e) }); }
            }
            w.google.remainingSig = sig; await store.saveWindow(w);
          }
        }
      }
    }
    await store.setMeta('lastSweep', { at: n.toISOString(), report });
    return report;
  }

  // Called by the Google Calendar push webhook (and hourly as a backstop).
  async function checkNewBookings(artist) {
    if (ARTISTS[artist] && ARTISTS[artist].trackCalendar === false) return { ok: true, sent: 0 };
    const from = today(); const to = addDays(from, 30);
    let evs;
    try { evs = await calendar.listEvents(artist, from, to, ARTISTS[artist].calendarId); } catch (e) { await log('warn', 'booking check failed', { artist, error: String(e.message || e) }); return { ok: false }; }
    const baseline = await store.getMeta('bookingsBaseline:' + artist);
    const windows = (await store.listWindows({ from, to })).filter((w) => w.artist === artist);
    const settings = (await store.getMeta('notifySettings')) || defaultNotifySettings();
    let sent = 0;
    for (const ev of evs) {
      const key = `${artist}:${ev.id}:${ev.start}`;
      if (await store.getSeen(key)) continue;
      await store.markSeen(key, { at: now().toISOString() });
      if (!baseline) continue; // first run: learn what already exists, notify nothing
      const type = classifyEvent(ev);
      const inWindow = windows.find((w) => w.status !== 'cancelled' && overlaps(new Date(ev.start), new Date(ev.end), localToUtc(w.date, w.start), localToUtc(w.date, w.end)));
      const s = settings[artist] || defaultNotifySettings()[artist];
      const want = (type === 'piercing' && s.piercing) || (type === 'consult' && s.consult) || (type === 'tattoo' && inWindow && s.piercing) || (type === 'tattoo' && !inWindow && s.tattoo);
      if (!want) continue;
      const lp = localParts(new Date(ev.start));
      const kind = type === 'tattoo' && inWindow ? 'Booking in your piercing window' : type === 'piercing' ? 'Piercing' : type === 'consult' ? 'Consultation' : 'Tattoo';
      const client = settings.showNames ? parseSummary(ev.summary, ev.description).client : null;
      await safeNotify({
        artist,
        title: `New booking · ${ARTISTS[artist].name}`,
        body: `${kind}${client ? ' · ' + client : ''}\n${dateLabel(lp.dateKey, today()).short}, ${hourLabel(lp.hour)}${lp.minute ? ':' + pad(lp.minute) : ''} · Confirmed in Fresha`,
        click: ev.link || 'https://partners.fresha.com/calendar',
        tags: 'calendar',
      });
      sent++;
    }
    if (!baseline) await store.setMeta('bookingsBaseline:' + artist, { at: now().toISOString() });
    return { ok: true, sent };
  }

  async function safeNotify(msg) {
    try { await notifier.send(msg); } catch (e) { await log('warn', 'notify failed', { error: String(e.message || e) }); }
  }

  async function getWeek({ start }) {
    let sweepError = null;
    try { await sweep(); } catch (e) { sweepError = String(e.message || e); await log('error', 'sweep failed', { error: sweepError }); }
    const from = start || today(); const to = addDays(from, 7);
    const windows = await store.listWindows({ from, to });
    const cal = {};
    for (const a of Object.keys(ARTISTS)) {
      if (ARTISTS[a].trackCalendar === false) { cal[a] = { verified: true, events: [], untracked: true }; continue; }
      try { cal[a] = { verified: true, events: await calendar.listEvents(a, from, to, ARTISTS[a].calendarId) }; }
      catch (e) { cal[a] = { verified: false, events: [], error: String(e.message || e) }; }
    }
    const days = [];
    for (let i = 0; i < 7; i++) {
      const date = addDays(from, i);
      const dayS = localToUtc(date, 0).getTime(); const dayE = localToUtc(addDays(date, 1), 0).getTime();
      const artists = {};
      for (const a of Object.keys(ARTISTS)) {
        const evs = cal[a].events.filter((ev) => overlaps(new Date(ev.start).getTime(), new Date(ev.end).getTime(), dayS, dayE)).map(slimEvent);
        const ws = windows.filter((w) => w.artist === a && w.date === date).sort((x, y) => x.start - y.start);
        const open = ws.filter(isActive);
        const shopS = localToUtc(date, BUSINESS.open).getTime(); const shopE = localToUtc(date, BUSINESS.close).getTime();
        const bookedMin = Math.round(evs.reduce((m, e) => m + Math.max(0, Math.min(new Date(e.end).getTime(), shopE) - Math.max(new Date(e.start).getTime(), shopS)), 0) / 60000);
        const freeH = freeHours(date, BUSINESS.open, BUSINESS.close, cal[a].events, ARTISTS[a].bufferMin).length;
        const count = (t) => evs.filter((e) => e.type === t).length;
        artists[a] = {
          untracked: !!cal[a].untracked,
          totals: { bookedMin, freeHours: freeH, tattoos: count('tattoo'), piercings: count('piercing'), consults: count('consult'), other: count('touchup') },
          verified: cal[a].verified,
          events: evs,
          tattoo: evs.some((e) => e.type === 'tattoo'),
          windows: ws,
          free: hoursToRanges(freeHours(date, BUSINESS.open, BUSINESS.close, cal[a].events, ARTISTS[a].bufferMin)),
          openHours: open.reduce((s, w) => s + (w.end - w.start), 0),
        };
      }
      days.push({ date, label: dateLabel(date, today()), artists });
    }
    const attention = [];
    for (const w of await store.listWindows({ from: addDays(today(), -3), to })) {
      if (w.status === 'attention' || w.google.state === 'failed' || w.google.state === 'remove_failed' || w.google.state === 'manual_remove') {
        attention.push({ windowId: w.id, artist: w.artist, date: w.date, text: attentionText(w) });
      } else if (w.google.state === 'processing' && now() - new Date(w.google.startedAt) > 30 * 60000) {
        attention.push({ windowId: w.id, artist: w.artist, date: w.date, text: attentionText(w), soft: true });
      } else if (w.status === 'awaiting_fresha') {
        attention.push({ windowId: w.id, artist: w.artist, date: w.date, text: `Finish opening ${ARTISTS[w.artist].name} ${rangeLabel(w.start, w.end)} in Fresha`, soft: true });
      } else if (w.fresha.state === 'close_needed') {
        attention.push({ windowId: w.id, artist: w.artist, date: w.date, text: `Block the rest of ${ARTISTS[w.artist].name}'s window in Fresha`, soft: true });
      }
    }
    for (const a of Object.keys(ARTISTS)) if (!cal[a].verified) attention.push({ artist: a, text: `${ARTISTS[a].name}'s Fresha calendar can't be read — tattoo bookings aren't confirmed`, soft: true, kind: 'calendar' });
    if (sweepError) attention.push({ text: 'Automatic closing check failed just now. It will try again within the hour.', kind: 'sweep' });
    return {
      now: now().toISOString(), today: today(), days, attention,
      integrations: { google: await google.status(), calendar: Object.fromEntries(Object.entries(cal).map(([k, v]) => [k, { ok: v.verified, untracked: !!v.untracked, error: v.error || null }])), lastSweep: await store.getMeta('lastSweep') },
      config: { bookingUrl: config.bookingUrl, business: BUSINESS },
      artists: publicArtists(),
    };
  }

  function publicArtists() {
    return Object.keys(ARTISTS).map((a) => {
      const A = ARTISTS[a];
      return { id: a, name: A.name, offers: A.offers, usualStart: A.usualStart, freshaColumn: A.freshaColumn, blockName: A.blockName, googleAuto: A.googleAuto !== false, trackCalendar: A.trackCalendar !== false, bookingUrl: bookingUrlFor(a), ownBookingUrl: A.bookingUrl || '', calendarId: A.calendarId || '' };
    });
  }

  async function saveArtistConfig({ artistConfig }) {
    const prev = (await store.getMeta('artistConfig')) || {};
    const next = cleanArtistConfig(artistConfig || {});
    const merged = {};
    for (const a of Object.keys(ARTISTS)) merged[a] = { ...(prev[a] || {}), ...next[a] };
    await store.setMeta('artistConfig', merged);
    applyArtistConfig(merged);
    await log('info', 'artist settings saved', null);
    return { ok: true, artists: publicArtists() };
  }

  // One honest check per connection; reports what actually answered.
  async function testConnection({ what, artist }) {
    const at = now().toISOString();
    try {
      if (what === 'calendar') {
        if (!ARTISTS[artist]) throw httpErr(400, 'Unknown artist');
        if (ARTISTS[artist].trackCalendar === false) return { ok: true, at, text: `Not reading a Fresha calendar for ${ARTISTS[artist].name} (walk-ins only). Turn it on in ${ARTISTS[artist].name}'s settings if needed.` };
        const evs = await calendar.listEvents(artist, today(), addDays(today(), 7), ARTISTS[artist].calendarId);
        const named = evs.filter((e) => parseSummary(e.summary, e.description).client).length;
        return { ok: true, at, text: `Read ${evs.length} booking${evs.length === 1 ? '' : 's'} for the next 7 days` + (evs.length && named < evs.length ? `. ${evs.length - named} show no client name; Fresha's calendar sync may be hiding details` : '') + '.' };
      }
      if (what === 'google') {
        const g = await google.status();
        if (!g.ready) return { ok: false, at, text: g.reason || 'Not set up' };
        const posts = await google.listPosts();
        return { ok: true, at, text: `Google answered. ${posts.length} post${posts.length === 1 ? '' : 's'} on the profile.` };
      }
      if (what === 'alert') {
        await notifier.send({ artist: artist || 'mor', title: 'Test from Mor Ink Availability', body: 'If you can read this, booking alerts reach this phone.', tags: 'white_check_mark' });
        return { ok: true, at, text: 'Test alert sent. Check the phone.' };
      }
      throw httpErr(400, 'Unknown test');
    } catch (e) {
      if (e.status === 400) throw e;
      return { ok: false, at, text: (what === 'google' ? friendly(e) : String(e.message || e)) };
    }
  }

  function attentionText(w) {
    const n = ARTISTS[w.artist].name;
    if (w.google.state === 'failed') return `${n}'s Google post didn't publish`;
    if (w.google.state === 'processing') return `${n}'s Google post is still processing`;
    if (w.google.state === 'remove_failed') return `${n}'s Google post couldn't be removed`;
    if (w.google.state === 'manual_remove') return `Delete ${n}'s hand-made Google post`;
    return `${n}'s window needs a look`;
  }

  async function mustGet(id) { const w = await store.getWindow(id); if (!w) throw httpErr(404, 'That window no longer exists.'); return w; }
  function hist(w, text) { (w.history = w.history || []).push({ at: now().toISOString(), text }); }
