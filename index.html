/* ---------------- sheets ---------------- */
function showSheet(html, state){
  S.sheet = state; $('sheetIn').innerHTML = '<div class="grab"></div>'+html;
  $('scrim').classList.add('on'); $('sheet').classList.add('on'); $('sheet').scrollTop = 0;
  var x=$('sheetClose'); if(x) x.onclick=closeSheet;
}
function closeSheet(){ S.sheet=null; $('scrim').classList.remove('on'); $('sheet').classList.remove('on'); }
$('scrim').onclick = closeSheet;
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });
function head(t){ return '<div class="sheet-h"><h3 id="sheetTitle">'+t+'</h3><button class="x" id="sheetClose" aria-label="Close">'+ico('x')+'</button></div>'; }

/* ---- open availability ---- */
var O;
function defaultStart(a, date){
  var A=artistOf(a); var s=A.usualStart||BUSINESS.open; var p=localParts(new Date());
  if (date===S.week.today && p.hour>=s) s=Math.min(p.hour+(p.minute?1:0), BUSINESS.close-1);
  return s;
}
function defaultServices(a){
  var A=artistOf(a);
  if(a==='mor') return {walkin:false, piercing:true, consult:true};
  return A.offers.indexOf('walkin')>=0 ? {walkin:true, piercing:false, consult:false} : {walkin:false, piercing:true, consult:true};
}
function openOpenSheet(init){
  var a = init.artist || S.artist; var date = init.date || S.week.today;
  O = { artist:a, date:date, start:defaultStart(a,date), end:BUSINESS.close, services:defaultServices(a), walkIns:false, ack:false, preview:null, seq:0 };
  showSheet('<div id="openBody" class="stack" style="gap:18px"></div>', {type:'open'});
  drawOpen(); refreshPreview();
}
function busyHour(info, date, h){
  if(!info||!info.verified) return false;
  var s=localToUtc(date,h).getTime(), e=localToUtc(date,h+1).getTime();
  return info.events.some(function(ev){ var buf = ev.type==='tattoo'?30*60000:0; return s < new Date(ev.end).getTime()+buf && new Date(ev.start).getTime()-buf < e; });
}
function drawOpen(){
  var W=S.week; var info=dayOf(O.date).artists[O.artist]; var dl=dateLabel(O.date,W.today); var A=artistOf(O.artist);
  var pastH = O.date===W.today ? localParts(new Date()).hour : -1;
  var h = head('OPEN AVAILABILITY');
  h += '<div class="who" role="group" aria-label="Artist">'+W.artists.map(function(x){return '<button type="button" data-artist="'+x.id+'" aria-pressed="'+(O.artist===x.id)+'">'+esc(x.name)+'</button>'}).join('')+'</div>';
  h += '<div><div class="label">Day</div><div class="chips">'+W.days.map(function(d){ var l=d.label; return '<button type="button" class="pick" data-date="'+d.date+'" aria-pressed="'+(O.date===d.date)+'"><small>'+esc(l.rel==='Today'?'Today':l.short.slice(0,3))+'</small><b>'+(+d.date.slice(8))+'</b></button>'; }).join('')+'</div></div>';
  var rib=''; for(var x=BUSINESS.open;x<BUSINESS.close;x++){ rib+='<div class="'+(busyHour(info,O.date,x)?'busy ':'')+(x>=O.start&&x<O.end?'sel':'')+'"></div>'; }
  h += '<div><div class="label">'+esc(dl.rel)+' · shop hours '+rangeLabel(BUSINESS.open,BUSINESS.close)+'</div><div class="ribbon" aria-hidden="true">'+rib+'</div><div class="ribbon-l"><span>10a</span><span>1p</span><span>4p</span><span>7p</span></div></div>';
  var from='', until='';
  for (var hh=BUSINESS.open; hh<BUSINESS.close; hh++) from += '<button type="button" class="pick'+(busyHour(info,O.date,hh)?' busy':'')+'" data-from="'+hh+'" aria-pressed="'+(O.start===hh)+'"'+(hh<pastH?' disabled':'')+'><b>'+tShort(hh)+'</b></button>';
  for (var e2=BUSINESS.open+1; e2<=BUSINESS.close; e2++) until += '<button type="button" class="pick'+(busyHour(info,O.date,e2-1)?' busy':'')+'" data-until="'+e2+'" aria-pressed="'+(O.end===e2)+'"'+(e2<=O.start?' disabled':'')+'><b>'+tShort(e2)+'</b></button>';
  h += '<div><div class="label">From</div><div class="hours">'+from+'</div></div><div><div class="label">Until</div><div class="hours">'+until+'</div></div>';
  h += '<div class="stack"><div class="label">What clients can come in for</div>';
  if (A.offers.indexOf('walkin')>=0) h += tog('walkin','Walk-in tattoos','No booking needed. The Google post invites walk-ins.',O.services.walkin);
  h += tog('piercing','Piercings','Booked online through Fresha.',O.services.piercing)+tog('consult','Consultations','Booked online through Fresha.',O.services.consult);
  if (A.offers.indexOf('walkin')<0) h += tog('walkIns','Also welcome walk-in piercings','Only if you’ll be free to take them. Otherwise the post says appointments only.',O.walkIns);
  h += '</div><div id="checkBox" class="stack"></div>';
  $('openBody').innerHTML=h; $('sheetClose').onclick=closeSheet;
  var q=function(sel,fn){ each($('openBody'), sel, function(b){ b.onclick=function(){ fn(b); drawOpen(); refreshPreview(); }; }); };
  q('[data-artist]', function(b){ O.artist=b.dataset.artist; O.start=defaultStart(O.artist,O.date); O.end=BUSINESS.close; O.services=defaultServices(O.artist); O.walkIns=false; O.ack=false; });
  q('[data-date]', function(b){ O.date=b.dataset.date; O.ack=false; O.start=defaultStart(O.artist,O.date); O.end=BUSINESS.close; });
  q('[data-from]', function(b){ O.start=+b.dataset.from; if(O.end<=O.start) O.end=Math.min(BUSINESS.close,O.start+1); });
  q('[data-until]', function(b){ O.end=+b.dataset.until; });
  q('[data-tog]', function(b){ var k=b.dataset.tog; if(k==='walkIns') O.walkIns=!O.walkIns; else O.services[k]=!O.services[k]; });
}
function tog(k,t,sub,on){ return '<button type="button" class="toggle" role="switch" data-tog="'+k+'" aria-checked="'+(!!on)+'"><span>'+t+(sub?'<small>'+sub+'</small>':'')+'</span><span class="sw"></span></button>'; }
function input(){ return { artist:O.artist, date:O.date, start:O.start, end:O.end, services:O.services, walkIns:O.walkIns }; }
function refreshPreview(){
  var seq=++O.seq; var box=$('checkBox'); if(box) box.innerHTML='<div class="check">'+ico('spin')+'<span>Checking '+esc(aName(O.artist))+'’s bookings…</span></div>';
  call('preview', input()).then(function(p){ if(seq!==O.seq) return; O.preview=p; drawCheck(); }).catch(function(){ if(seq!==O.seq) return; var b=$('checkBox'); if(b) b.innerHTML='<div class="check bad">'+ico('alert')+'<span>Couldn’t check the schedule. Try again with a connection.</span></div>'; });
}
function drawCheck(){
  var p=O.preview, c=p.check, box=$('checkBox'); if(!box) return;
  var h='';
  c.errors.forEach(function(e){ h += '<div class="check bad">'+ico('alert')+'<div>'+esc(e.text)+(e.free&&e.free.length?'<div class="sugg">'+e.free.map(function(r){return '<button type="button" data-use="'+r[0]+'-'+r[1]+'">Use '+rangeLabel(r[0],r[1])+'</button>'}).join('')+'</div>':'')+(e.windowId?'<div class="sugg"><button type="button" data-showwin="'+e.windowId+'">See that window</button></div>':'')+'</div></div>'; });
  if (c.ok){
    c.warnings.forEach(function(w){ h += '<div class="check warn">'+ico('alert')+'<div>'+esc(w.text)+'</div></div>'+tog('ack','I checked Fresha. Nothing is booked then.','',O.ack); });
    if (!c.warnings.length) h += '<div class="check ok">'+ico('check')+'<span>No bookings in this window (30 min buffer around tattoos).</span></div>';
    c.notes.forEach(function(n){ h += '<div class="check warn">'+ico('clock')+'<span>'+esc(n)+'</span></div>'; });
    var dl=dateLabel(O.date,S.week.today); var needF = O.services.piercing||O.services.consult;
    h += '<div class="summary"><span class="sm">'+esc(aName(O.artist))+' · '+esc(dl.rel==='Today'||dl.rel==='Tomorrow'?dl.rel+', '+dl.short:dl.short)+' · '+esc(servicesShort(O.services))+'</span><span class="big">'+rangeLabel(c.start,c.end)+'</span><span class="sm">'+(needF?'Next: a 30-second change in Fresha. ':'Walk-ins only, so nothing to change in Fresha. ')+'Ends at '+hourLabel(c.end)+'; the app takes the Google post down '+CLOSE_LAG_TEXT+'.</span></div>';
    h += '<details><summary>Google post that will go up</summary><div class="post">'+esc(p.post.summary)+'</div></details>';
    h += '<button class="btn gold full" type="button" id="doOpen"'+(c.warnings.length && !O.ack?' disabled':'')+'>Open '+rangeLabel(c.start,c.end)+'</button>';
  }
  box.innerHTML=h;
  each(box,'[data-use]',function(b){ b.onclick=function(){ var r=b.dataset.use.split('-'); O.start=+r[0]; O.end=+r[1]; drawOpen(); refreshPreview(); }; });
  each(box,'[data-showwin]',function(b){ b.onclick=function(){ openWindowSheet(b.dataset.showwin); }; });
  var ack=box.querySelector('[data-tog="ack"]'); if(ack) ack.onclick=function(){ O.ack=!O.ack; drawCheck(); };
  var go=$('doOpen'); if(go) go.onclick=function(){
    go.disabled=true; go.textContent='Opening…';
    call('open', Object.assign(input(), { requestId: rid(), acknowledgeUnverified: O.ack })).then(function(r){
      if(!r.ok){ O.preview.check=r.check; drawCheck(); return; }
      S.artist=r.window.artist; S.date=r.window.date;
      toast(r.window.fresha.state==='not_needed'?'Open for walk-ins':'Saved. Next: Fresha.'); openWindowSheet(r.window.id, false, r.window); load();
    }).catch(function(){ go.disabled=false; go.textContent='Try again'; });
  };
}

/* ---- one window ---- */
function findWindow(id){ var f=null; (S.week?S.week.days:[]).forEach(function(d){ Object.keys(d.artists).forEach(function(a){ d.artists[a].windows.forEach(function(w){ if(w.id===id) f=w; }); }); }); return f; }
function step(state, icon, title, text, extra){ return '<div class="step"><div class="dot '+state+'">'+ico(icon)+'</div><div><h4>'+title+'</h4>'+(text?'<p>'+text+'</p>':'')+(extra||'')+'</div></div>'; }
function openWindowSheet(id, keep, given){
  var w = given || findWindow(id); if(!w){ if(!keep) toast('That window is outside this week.'); return; }
  var top = keep ? $('sheet').scrollTop : 0;
  var dl=dateLabel(w.date,S.week.today); var nm=esc(aName(w.artist));
  var h = head(nm.toUpperCase()+' · '+esc((dl.rel==='Today'||dl.rel==='Tomorrow'?dl.rel:dl.short).toUpperCase()));
  h += '<div class="summary"><span class="sm">'+esc(servicesShort(w.services))+(w.services.walkin?'':(w.walkIns?' · walk-ins welcome':' · appointments only'))+'</span><span class="big">'+rangeLabel(w.start,w.end)+'</span></div><div class="steps">';
  h += step(w.protection.verified?'ok':'work', w.protection.verified?'check':'alert', 'Schedule checked', w.protection.verified?'No tattoo or other booking in this window.':'The calendar couldn’t be read. You confirmed Fresha was clear.');
  var fs=w.fresha.state, endTxt = w.end===BUSINESS.close ? 'Your Fresha shop hours end at '+hourLabel(w.end)+', so online booking should stop then.' : 'The block you set from '+hourLabel(w.end)+' should stop new bookings then.';
  var freshaBtns = '<div class="row"><a class="btn" href="'+FRESHA_CAL+'" target="_blank" rel="noopener">Open Fresha</a><button class="btn gold" type="button" data-act="confirmFresha">Done in Fresha</button></div>';
  if (fs==='waiting') h += step('work','dot','Open it in Fresha','Fresha can’t be changed by apps, so this part is yours. About 30 seconds.','<ol>'+w.fresha.steps.map(function(s){return '<li>'+s+'</li>'}).join('')+'</ol>'+freshaBtns);
  else if (fs==='applied') h += step('ok','check','Open in Fresha (you confirmed)','Confirmed at '+clockTime(w.fresha.confirmedAt)+'. '+endTxt+' The app can’t see Fresha to check.');
  else if (fs==='close_needed') h += step('work','dot','Block the rest in Fresha','New bookings stop once this block is in. Booked clients keep their appointments.','<ol>'+w.fresha.closeSteps.map(function(s){return '<li>'+s+'</li>'}).join('')+'</ol>'+freshaBtns);
  else if (fs==='closed') h += step('ok','check','Closed in Fresha (you confirmed)','Confirmed at '+clockTime(w.fresha.closedConfirmedAt)+'.');
  else if (fs==='self_closed') h += step('ok','check','Should be closed in Fresha','The window ended at '+hourLabel(w.end)+'. The app can’t check Fresha, so glance at the calendar if in doubt.');
  else if (fs==='not_needed') h += step('ok','check','Nothing to do in Fresha','Walk-ins only. Add each walk-in to Fresha when they arrive.');
  else h += step('idle','dot','Fresha','Never opened in Fresha, so nothing to close.');
  var gs=w.google.state;
  var G = { waiting_fresha:['idle','dot','Google post','Goes up after you tap Done in Fresha, so Google never advertises times that aren’t bookable.'],
    publishing:['work spin','spin','Sending to Google…',''],
    processing:['work','clock','Google is processing the post','Google accepted it but hasn’t shown it yet. The app checks again every hour and when you open it. It isn’t live until this says so.','<div class="row"><button class="btn" type="button" data-act="retry">Check now</button></div>'],
    published:['ok','check','Live on Google','Google reported it live at '+(w.google.publishedAt?clockTime(w.google.publishedAt):'—')+'. The app removes it after '+hourLabel(w.end)+', '+CLOSE_LAG_TEXT+'.','<details><summary>Post text</summary><div class="post">'+esc(w.google.text||'')+'</div></details>'],
    failed:['bad','alert','Google post didn’t go up',esc(w.google.error||'')+'. Your Fresha window is unaffected.','<div class="row"><button class="btn gold" type="button" data-act="retry">Try again</button><button class="btn" type="button" data-act="copy">Copy text instead</button></div>'],
    manual:['work','mega','Post it on Google',esc(w.google.error||'Automatic posting isn’t on')+'. Copy this, then on your profile tap Add update, paste, add the button, and post.','<div class="post" id="postText">'+esc(w.google.text||'')+'</div><div class="row"><button class="btn gold" type="button" data-act="copy">Copy text</button><a class="btn" href="'+GOOGLE_PROFILE+'" target="_blank" rel="noopener">Open profile</a></div><div class="row"><button class="btn ghost" type="button" data-act="posted">I posted it</button></div>'],
    manual_posted:['ok','check','Posted by hand','When the window ends, the app reminds you to delete it.'],
    removing:['work spin','spin','Removing from Google…',''],
    removed:['ok','check','Removed from Google','Gone at '+(w.google.removedAt?clockTime(w.google.removedAt):'—')+' and checked.'],
    remove_failed:['bad','alert','Google post is still up',esc(w.google.error||'')+'. The app retries every hour.','<div class="row"><button class="btn gold" type="button" data-act="retry">Remove now</button><button class="btn" type="button" data-act="removedByHand">I deleted it myself</button></div>'],
    manual_remove:['bad','alert','Delete the Google post','You posted this one by hand, so delete it on your profile.','<div class="row"><a class="btn" href="'+GOOGLE_PROFILE+'" target="_blank" rel="noopener">Open profile</a><button class="btn gold" type="button" data-act="removedByHand">Deleted</button></div>'],
    manual_done:['ok','check','Google post removed','You deleted it by hand.'],
    off:['idle','dot','Google post','No post for this window.'] }[gs] || ['idle','dot','Google post',''];
  h += step(G[0],G[1],G[2],G[3],G[4]);
  h += isActive(w) ? step('idle','clock','Ends at '+hourLabel(w.end), w.status==='awaiting_fresha'?'Once it’s open in Fresha.':'No evening step for you. The app removes the Google post after '+hourLabel(w.end)+', '+CLOSE_LAG_TEXT+'.') : step('ok','check', w.status==='cancelled'?'Cancelled':'Closed', w.fullyBooked?'Fully booked. The Google post came down early.':'Existing appointments were kept.');
  h += '</div>';
  if (isActive(w)){ var started = new Date() >= localToUtc(w.date,w.start); h += '<button class="btn danger full" type="button" id="closeBtn" data-label="'+(started?'Close the rest now':'Cancel this window')+'">'+(started?'Close the rest now':'Cancel this window')+'</button>'; }
  if (w.history && w.history.length) h += '<details><summary>Activity</summary><div class="hist">'+w.history.slice().reverse().map(function(x){return '<span>'+clockTime(x.at)+' · '+esc(x.text)+'</span>'}).join('')+'</div></details>';
  showSheet(h, {type:'window', id:w.id}); $('sheet').scrollTop = top;
  each($('sheetIn'),'[data-act]',function(b){ b.onclick=function(){ act(b.dataset.act, w, b); }; });
  var cb=$('closeBtn'); if(cb) cb.onclick=function(){
    if(!cb.classList.contains('armed')){ cb.classList.add('armed'); cb.textContent='Tap again to confirm'; setTimeout(function(){ if(cb.isConnected){ cb.classList.remove('armed'); cb.textContent=cb.dataset.label; } }, 4000); return; }
    cb.disabled=true; cb.textContent='Closing…';
    call('close',{windowId:w.id, requestId:rid()}).then(function(r){ toast(r.window.status==='closed'||r.window.status==='cancelled'?'Closed':'New bookings stop once Fresha is blocked'); afterAct(r.window); }).catch(function(){ cb.disabled=false; });
  };
}
function afterAct(w){ openWindowSheet(w.id, true, w); load(); }
function act(what, w, b){
  if (what==='copy'){ copy(w.google.text||''); return; }
  b.disabled=true;
  var m = { confirmFresha:['confirmFresha',{}], retry:['retry',{}], posted:['manual',{what:'posted'}], removedByHand:['manual',{what:'removed'}] }[what];
  call(m[0], Object.assign({windowId:w.id, requestId:rid()}, m[1])).then(function(r){
    var g=r.window.google.state;
    if (what==='confirmFresha') toast(g==='published'?'Open · Google reports the post live':g==='processing'?'Open · Google is processing the post':g==='failed'?'Open · Google post failed':'Open in Fresha');
    afterAct(r.window);
  }).catch(function(){ b.disabled=false; load(); });
}
function copy(t){
  var ok=function(){ toast('Copied'); }, fail=function(){ var el=$('postText'); if(el){ var r=document.createRange(); r.selectNodeContents(el); var s=getSelection(); s.removeAllRanges(); s.addRange(r); } toast('Press and hold to copy'); };
  try{ navigator.clipboard.writeText(t).then(ok, fail); }catch(e){ fail(); }
}

    b.disabled=true; call('closeAllFuture',{artist:b.dataset.cf, requestId:rid()}).then(function(r){ toast(r.windows.length?'Closed '+r.windows.length+' window'+(r.windows.length>1?'s':'')+'. Check “Needs you” for Fresha steps.':'Nothing was open'); load(); closeSheet(); });
  }; });
  var so=$('signOut'); if(so) so.onclick=function(){ store('token',null); location.reload(); };
  call('getSettings').then(function(r){
    var st=r.settings; var box=$('notifBox'); if(!box) return;
    var hh='<div class="label">Booking alerts</div>';
    W.artists.forEach(function(a){
      st[a.id]=st[a.id]||{piercing:true,consult:true,tattoo:false};
      if(a.offers.indexOf('piercing')>=0) hh += tog(a.id+'.piercing',a.name+': piercings','',st[a.id].piercing);
      if(a.offers.indexOf('consult')>=0) hh += tog(a.id+'.consult',a.name+': consultations','',st[a.id].consult);
      hh += tog(a.id+'.tattoo',a.name+': tattoo bookings','',st[a.id].tattoo);
    });
    hh += tog('showNames','Show client names in alerts','Off by default. Alerts pass through ntfy’s free public server.',st.showNames)+tog('muted','Pause all alerts','',st.muted)+'<div class="empty">Opening availability never sends an alert. Only a real booking does.</div>';
    box.innerHTML=hh;
    each(box,'[data-tog]',function(b){ b.onclick=function(){ var k=b.dataset.tog.split('.'); if(k.length===1) st[k[0]]=!st[k[0]]; else st[k[0]][k[1]]=!st[k[0]][k[1]]; b.setAttribute('aria-checked', k.length===1?st[k[0]]:st[k[0]][k[1]]); call('saveSettings',{settings:st}).then(function(){ toast('Saved'); }); }; });
  }).catch(function(){});
}

  return '<details class="artist-set"><summary>'+esc(a.name)+' <span class="empty" style="margin-left:8px">'+esc(a.offers.map(function(o){return SERVICE_NAMES[o]}).join(' · '))+'</span></summary><div class="stack">'+
    '<button type="button" class="toggle" role="switch" id="'+id('gauto')+'" data-gauto="1" aria-checked="'+a.googleAuto+'"><span>Automatic Google posts<small>Off = the app gives you the text to post by hand.</small></span><span class="sw"></span></button>'+
    '<button type="button" class="toggle" role="switch" id="'+id('track')+'" data-gauto="1" aria-checked="'+a.trackCalendar+'"><span>Check '+esc(a.name)+'’s Fresha bookings<small>Uses the linked Google Calendar to protect tattoo bookings. It never changes appointments. Turn off only when this artist has no appointments to protect.</small></span><span class="sw"></span></button>'+
    '<div class="field"><label for="'+id('url')+'">Fresha booking link</label><input id="'+id('url')+'" type="url" inputmode="url" placeholder="https://www.fresha.com/…" value="'+esc(a.ownBookingUrl)+'"><small>Used for Google’s Book button. Empty = the shop link'+(a.bookingUrl&&!a.ownBookingUrl?' ('+esc(a.bookingUrl)+')':'')+'.</small></div>'+
    '<div class="field"><label for="'+id('col')+'">Fresha column name</label><input id="'+id('col')+'" type="text" value="'+esc(a.freshaColumn)+'"></div>'+
    '<div class="field"><label for="'+id('blk')+'">Name of the daily “closed” block</label><input id="'+id('blk')+'" type="text" value="'+esc(a.blockName)+'"></div>'+
    '<div class="field"><label for="'+id('start')+'">Usual start time</label><select id="'+id('start')+'">'+opts+'</select></div>'+
    '<div class="field"><label for="'+id('cal')+'">Google Calendar ID for Fresha sync</label><input id="'+id('cal')+'" type="text" placeholder="name@mortattoo.com or calendar ID" value="'+esc(a.calendarId)+'"><small>Fresha syncs appointments into this Google Calendar. The app reads it to avoid opening a window over tattoo bookings. It does not add, move or cancel Fresha appointments.</small></div>'+
    '<button class="btn gold" type="button" data-save="'+a.id+'">Save '+esc(a.name)+'</button></div></details>';
}
